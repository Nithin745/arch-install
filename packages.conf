# Arch Linux Post-Installation Package Configuration
# ============================================
# IMPORTANT: This file is for POST-INSTALL packages only!
# ============================================
#
# Base system packages (kernel, drivers, network, audio, etc.) are automatically
# installed by install.sh based on detected hardware. This file contains ADDITIONAL
# packages to be installed during post-install.sh.
#
# What's already installed by install.sh:
#   - Base system (base, base-devel, linux/linux-lts, linux-firmware)
#   - CPU microcode (intel-ucode or amd-ucode)
#   - GPU drivers (mesa, vulkan, nvidia/amd/intel drivers)
#   - Filesystem tools (btrfs-progs, ntfs-3g, exfatprogs, etc.)
#   - Network (NetworkManager, wpa_supplicant, iwd, openssh)
#   - Audio (pipewire, wireplumber, alsa-utils)
#   - Basic utilities (sudo, git, wget, curl, rsync, zip, tar, etc.)
#   - Power management (acpi, acpid)
#   - Basic development (gcc, make, cmake)
#
# Edit this file to add packages you want installed after base system.

# ============================================
# TEXT EDITORS
# ============================================
# Essential text editors for terminal and advanced editing
EDITOR_PACKAGES="neovim"

# ============================================
# SYSTEM MONITORING & INFORMATION
# ============================================
# Advanced system monitoring and hardware information tools
MONITORING_PACKAGES=""

# ============================================
# FILE MANAGEMENT UTILITIES
# ============================================
# Terminal-based file managers and search tools
FILEMANAGER_PACKAGES="ranger fzf fd ripgrep tree"

# ============================================
# COMPRESSION & ARCHIVE TOOLS
# ============================================
# Additional compression formats beyond basic zip/tar/gzip/xz
COMPRESSION_PACKAGES="p7zip bzip2 unrar"

# ============================================
# SHELL ENVIRONMENTS
# ============================================
# Alternative shells and completions
SHELL_PACKAGES=""

# ============================================
# ADVANCED POWER MANAGEMENT
# ============================================
# Battery optimization and thermal management for laptops
POWER_PACKAGES="tlp powertop thermald"

# ============================================
# AUDIO CONTROL
# ============================================
# GUI audio mixer and volume control
AUDIO_PACKAGES=""

# ============================================
# NETWORK UTILITIES (Optional)
# ============================================
# Additional networking tools (uncomment if needed)
# DNS tools (dig, nslookup)
# NETWORK_UTILITIES="bind-tools"

# Local DNS caching and DHCP server (for advanced users)
# NETWORK_UTILITIES="$NETWORK_UTILITIES dnsmasq"

# ============================================
# FIREWALL
# ============================================
# Firewall management (firewalld chosen for this system)
FIREWALL_PACKAGES="firewalld"

# Alternative: Uncomment for UFW instead (simpler, more user-friendly)
# FIREWALL_PACKAGES="ufw"

# ============================================
# DEVELOPMENT TOOLS
# ============================================
# Advanced development tools beyond basic gcc/make/cmake

# Additional compilers and build systems
DEVELOPMENT_PACKAGES="clang ninja meson automake autoconf pkg-config"

# Version control tools
DEVELOPMENT_PACKAGES="$DEVELOPMENT_PACKAGES git-lfs"

# Build optimization tools (optional, uncomment if needed)
# DEVELOPMENT_PACKAGES="$DEVELOPMENT_PACKAGES ccache sccache distcc"

# Debugging and profiling tools (optional, uncomment if needed)
# DEVELOPMENT_PACKAGES="$DEVELOPMENT_PACKAGES gdb valgrind strace ltrace perf"

# Version control systems (optional, uncomment if needed)
# DEVELOPMENT_PACKAGES="$DEVELOPMENT_PACKAGES subversion mercurial"

# ============================================
# CONTAINER TOOLS
# ============================================
# Podman container management (Docker alternative)
CONTAINER_PACKAGES="podman podman-compose podman-docker buildah skopeo"

# ============================================
# VIRTUALIZATION (Optional)
# ============================================
# Full virtualization stack with KVM/QEMU
# Uncomment if you need to run virtual machines
# VIRTUALIZATION_PACKAGES="qemu-full virt-manager libvirt edk2-ovmf dnsmasq bridge-utils iptables-nft"

# ============================================
# DESKTOP ENVIRONMENT (Optional)
# ============================================
# Uncomment ONE of the desktop environments below if you want a GUI

# Xorg display server (required for most DEs except Wayland-only)
# DE_PACKAGES="xorg xorg-server xorg-xinit xorg-apps"

# GNOME Desktop
# DE_PACKAGES="$DE_PACKAGES gnome gnome-extra gdm"

# KDE Plasma Desktop
# DE_PACKAGES="$DE_PACKAGES plasma plasma-wayland-session kde-applications sddm"

# XFCE Desktop (lightweight)
# DE_PACKAGES="$DE_PACKAGES xfce4 xfce4-goodies lightdm lightdm-gtk-greeter"

# i3 Window Manager (tiling WM for power users)
# DE_PACKAGES="$DE_PACKAGES i3-wm i3status i3lock dmenu rofi picom nitrogen alacritty"

# Hyprland (Modern Wayland compositor)
# DE_PACKAGES="$DE_PACKAGES hyprland waybar wofi kitty"

# Cinnamon Desktop (familiar, traditional)
# DE_PACKAGES="$DE_PACKAGES cinnamon lightdm lightdm-gtk-greeter"

# MATE Desktop (lightweight, traditional)
# DE_PACKAGES="$DE_PACKAGES mate mate-extra lightdm lightdm-gtk-greeter"

# ============================================
# OPTIONAL APPLICATIONS
# ============================================
# Common desktop applications (uncomment what you need)

# Web Browsers
OPTIONAL_PACKAGES="firefox"
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES chromium"

# Office Suite
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES libreoffice-fresh"

# Media Players
OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES mpv"

# Image Viewers and Editors
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES gimp inkscape feh"

# PDF Readers
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES evince okular zathura zathura-pdf-mupdf"

# Terminal Emulators (additional)
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES alacritty kitty"

# File Managers (GUI)
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES thunar dolphin nemo nautilus"

# Communication
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES discord telegram-desktop thunderbird"

# Development IDEs
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES code geany qtcreator"

# Printing Support (uncomment if you have a printer)
PRINTING_PACKAGES="cups cups-pdf system-config-printer hplip"

# ============================================
# NOTES
# ============================================
# 1. BASE SYSTEM packages are already installed by install.sh
# 2. Add your personal packages to custom-packages.txt
# 3. Comment out packages you don't need by adding # at the start
# 4. Desktop environment packages are commented by default
# 5. For AUR packages, add them to custom-packages.txt with 'AUR:' prefix
# 6. Run post-install.sh to install packages from this file
# 7. Backup created: packages.conf.backup (for comparison)
