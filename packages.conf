# Arch Linux Package Configuration
# Edit this file to customize your package selection
# Packages are space-separated on each line

# ============================================
# BASE SYSTEM PACKAGES
# ============================================
# Essential packages for a working Arch system
BASE_PACKAGES="base base-devel linux linux-headers linux-firmware"

# ============================================
# FIRMWARE PACKAGES
# ============================================
# Hardware firmware for various devices
# Include ALL firmware to ensure maximum hardware compatibility
FIRMWARE_PACKAGES="linux-firmware-qlogic linux-firmware-bnx2x linux-firmware-liquidio linux-firmware-mellanox linux-firmware-nfp linux-firmware-whence sof-firmware alsa-firmware amd-ucode intel-ucode"

# ============================================
# DRIVER PACKAGES
# ============================================
# Graphics drivers (install based on your hardware)
DRIVER_PACKAGES="mesa vulkan-radeon vulkan-intel vulkan-mesa-layers libva-mesa-driver mesa-vdpau xf86-video-amdgpu xf86-video-intel xf86-video-nouveau xf86-video-vesa xf86-video-fbdev"

# Additional driver packages
DRIVER_PACKAGES="$DRIVER_PACKAGES libva-intel-driver intel-media-driver nvidia-open-dkms nvidia-utils opencl-nvidia libvdpau"

# Input and peripheral drivers
DRIVER_PACKAGES="$DRIVER_PACKAGES xf86-input-libinput xf86-input-evdev xf86-input-synaptics xf86-input-wacom"

# Filesystem drivers
DRIVER_PACKAGES="$DRIVER_PACKAGES ntfs-3g exfat-utils dosfstools btrfs-progs xfsprogs f2fs-tools"

# ============================================
# NETWORK PACKAGES
# ============================================
# Network tools and utilities
NETWORK_PACKAGES="networkmanager network-manager-applet wireless_tools wpa_supplicant dialog dhcpcd iwd openssh openresolv dnsmasq bind-tools wget curl rsync git"

# Bluetooth support
NETWORK_PACKAGES="$NETWORK_PACKAGES bluez bluez-utils"

# Firewall
NETWORK_PACKAGES="$NETWORK_PACKAGES iptables-nft firewalld ufw"

# ============================================
# SYSTEM UTILITIES
# ============================================
# Essential system tools
SYSTEM_PACKAGES="sudo man-db man-pages texinfo nano vim neovim"

# System monitoring and management
SYSTEM_PACKAGES="$SYSTEM_PACKAGES htop btop neofetch fastfetch lshw usbutils pciutils dmidecode"

# Archive and compression
SYSTEM_PACKAGES="$SYSTEM_PACKAGES zip unzip unrar p7zip tar gzip bzip2 xz"

# File management
SYSTEM_PACKAGES="$SYSTEM_PACKAGES ranger nnn mc fzf fd ripgrep tree"

# System utilities
SYSTEM_PACKAGES="$SYSTEM_PACKAGES bash-completion zsh zsh-completions"

# Power management
SYSTEM_PACKAGES="$SYSTEM_PACKAGES acpi acpid tlp powertop thermald"

# Audio
SYSTEM_PACKAGES="$SYSTEM_PACKAGES pipewire pipewire-alsa pipewire-pulse pipewire-jack wireplumber pavucontrol alsa-utils"

# Printing (optional, uncomment if needed)
# SYSTEM_PACKAGES="$SYSTEM_PACKAGES cups cups-pdf system-config-printer hplip"

# ============================================
# DEVELOPMENT PACKAGES
# ============================================
# Development tools and compilers
DEVELOPMENT_PACKAGES="gcc clang make cmake ninja meson automake autoconf pkg-config"

# Version control
DEVELOPMENT_PACKAGES="$DEVELOPMENT_PACKAGES git git-lfs github-cli subversion mercurial"

# Build tools
DEVELOPMENT_PACKAGES="$DEVELOPMENT_PACKAGES ccache sccache distcc"

# Debugging and profiling
DEVELOPMENT_PACKAGES="$DEVELOPMENT_PACKAGES gdb valgrind strace ltrace perf"

# ============================================
# CONTAINER AND VIRTUALIZATION
# ============================================
# Podman (instead of Docker as per user preference)
CONTAINER_PACKAGES="podman podman-compose podman-docker buildah skopeo"

# Virtualization (optional, uncomment if needed)
# CONTAINER_PACKAGES="$CONTAINER_PACKAGES qemu-full virt-manager libvirt edk2-ovmf dnsmasq bridge-utils"

# ============================================
# DESKTOP ENVIRONMENT (Optional)
# ============================================
# Uncomment the desktop environment you want to install

# Xorg (required for most DEs)
# DE_PACKAGES="xorg xorg-server xorg-xinit xorg-apps"

# GNOME
# DE_PACKAGES="$DE_PACKAGES gnome gnome-extra gdm"

# KDE Plasma
# DE_PACKAGES="$DE_PACKAGES plasma plasma-wayland-session kde-applications sddm"

# XFCE
# DE_PACKAGES="$DE_PACKAGES xfce4 xfce4-goodies lightdm lightdm-gtk-greeter"

# i3 (Window Manager)
# DE_PACKAGES="$DE_PACKAGES i3-wm i3status i3lock dmenu rofi picom nitrogen"

# Hyprland (Wayland Compositor)
# DE_PACKAGES="$DE_PACKAGES hyprland waybar wofi kitty"

# ============================================
# OPTIONAL PACKAGES
# ============================================
# Browser (uncomment what you need)
OPTIONAL_PACKAGES="firefox chromium"

# Office suite
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES libreoffice-fresh"

# Media players
OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES vlc mpv"

# Image viewers and editors
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES gimp inkscape feh gwenview"

# PDF reader
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES evince okular zathura zathura-pdf-mupdf"

# Terminal emulators
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES alacritty kitty terminator"

# File managers
# OPTIONAL_PACKAGES="$OPTIONAL_PACKAGES thunar dolphin nemo nautilus"

# ============================================
# NOTES
# ============================================
# 1. All packages listed here will be installed during base installation
# 2. Add your custom packages to custom-packages.txt instead of modifying this file
# 3. Comment out packages you don't need by adding # at the start of the line
# 4. Desktop environment packages are commented by default - uncomment what you need
# 5. For AUR packages, add them to custom-packages.txt with 'AUR:' prefix
